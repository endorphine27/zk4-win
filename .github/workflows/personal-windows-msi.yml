name: Personal Windows MSI

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  msi:
    name: Windows x64 (unsigned)
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      WEBVIEW2_VERSION: 1.0.4078.44
    steps:
      - uses: actions/checkout@v6

      # Native Windows runtime (libmpv-2.dll), kept as a release asset in zk4-deps
      - name: Fetch Windows runtime
        shell: bash
        run: |
          runtime_path="composeApp/src/desktopMain/native/windows/runtime/libmpv-2.dll"
          curl --fail --location --retry 5 --silent --show-error -o "${runtime_path}" \
            "https://github.com/endorphine27/zk4-deps/releases/download/runtime-v1/libmpv-2.dll"
          size="$(wc -c < "${runtime_path}")"
          echo "libmpv-2.dll: ${size} bytes"
          (( size > 1000000 )) || { echo "runtime not downloaded" >&2; exit 1; }

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      # Own CINEBOX server. The public client key is read from the server's discovery document;
      # Trakt, MDBList and Sentry keys stay empty.
      - name: Create local.properties
        shell: bash
        run: |
          key="$(curl -fsS https://destinyab.go.ro:8444/.well-known/cinebox | jq -r .publishable_key)"
          test -n "$key" && test "$key" != null
          {
            echo "CINEBOX_SUPABASE_URL=https://destinyab.go.ro:8444"
            echo "CINEBOX_SUPABASE_ANON_KEY=${key}"
            echo "CINEBOX_SUPABASE_FALLBACK_URL="
            echo "CINEBOX_DISCORD_CLIENT_ID=1565830214301253632"
          } > local.properties

      - name: Install WebView2 SDK
        shell: pwsh
        run: |
          nuget install Microsoft.Web.WebView2 `
            -Version $env:WEBVIEW2_VERSION `
            -OutputDirectory "$env:RUNNER_TEMP\nuget" `
            -DirectDownload -NonInteractive -NoCache
          $root = Join-Path $env:RUNNER_TEMP "nuget\Microsoft.Web.WebView2.$env:WEBVIEW2_VERSION"
          if (-not (Test-Path (Join-Path $root "build\native\x64\WebView2Loader.dll.lib"))) { throw "WebView2 SDK missing" }
          "WEBVIEW2_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Compute app version
        shell: bash
        run: echo "APP_VERSION=0.1.33-alpha.$(printf '%04d' "${GITHUB_RUN_NUMBER}")" >> "$GITHUB_ENV"

      - name: Build unsigned MSI
        shell: pwsh
        run: |
          & .\gradlew.bat :composeApp:createReleaseDistributable :composeApp:packageReleaseMsi `
            "-Pcinebox.webview2.dir=$env:WEBVIEW2_ROOT" `
            "-Pcinebox.desktop.versionName=$env:APP_VERSION" `
            "-Pcompose.desktop.packaging.checkJdkVendor=false" `
            --no-configuration-cache --no-daemon --stacktrace

      # Portable copy: unzip and run CINEBOX.exe, no installer needed
      - name: Zip portable app
        shell: pwsh
        run: |
          $dir = Get-ChildItem -Path composeApp\build\compose\binaries -Directory -Recurse -Filter CINEBOX | Where-Object { Test-Path (Join-Path $_.FullName "CINEBOX.exe") } | Select-Object -First 1
          if (-not $dir) { throw "Portable app folder not found" }
          Compress-Archive -Path $dir.FullName -DestinationPath "Cinebox-Windows-x64-portable.zip"
          Get-Item Cinebox-Windows-x64-portable.zip | Format-List Name, Length

      - name: Publish MSI to a release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          msi="$(find composeApp/build -name "Cinebox-Windows-*.msi" | head -n 1)"
          test -f "$msi"
          ls -lh "$msi"
          gh release create "v${APP_VERSION}" "$msi" Cinebox-Windows-x64-portable.zip --title "Windows build ${GITHUB_RUN_NUMBER}" --notes-file RELEASE_NOTES.md --prerelease
